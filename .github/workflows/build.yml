# 一键产出三端成品:HTML 压缩包 / Windows EXE 安装包 / Android APK
# 触发方式:推送到 main 分支,或在 GitHub 仓库 Actions 页手动点击 Run workflow
name: build-all

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  html:
    runs-on: ubuntu-latest
    name: HTML 版
    steps:
      - uses: actions/checkout@v4
      - name: 打包 web 目录
        run: |
          cd web
          zip -r ../wordsteps-html.zip . -x "sample/*"
      - uses: actions/upload-artifact@v4
        with:
          name: wordsteps-html
          path: wordsteps-html.zip

  exe:
    runs-on: windows-latest
    name: Windows EXE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 同步 web 并安装依赖
        run: |
          node scripts/sync-web.mjs desktop/www
          cd desktop
          npm install
      - name: 打包 NSIS 安装包
        run: |
          cd desktop
          npx electron-builder --win --x64
      - uses: actions/upload-artifact@v4
        with:
          name: wordsteps-exe
          path: |
            desktop/dist/*.exe
            desktop/dist/*.yml

  apk:
    runs-on: ubuntu-latest
    name: Android APK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
      - name: 同步 web 并安装 Capacitor 依赖
        run: |
          node scripts/sync-web.mjs mobile/www
          cd mobile
          npm install
      - name: 生成 Android 工程并构建 APK
        run: |
          cd mobile
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wordsteps-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
